## Review feedback closes the loop without a terminal either.
##
## Leave an inline comment on a pull request — or a review, or a comment on the
## issue — mentioning @claude, and the agent reads it, makes the change, pushes
## to the same branch and replies.
##
## No `prompt` input, so the action runs in interactive mode: it waits for the
## trigger phrase rather than being told what to do up front.
name: Agent · respond

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Several review comments in a row are several requests, so they queue rather
# than cancel each other.
concurrency:
  group: agent-respond-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    # A review carries its body on `review`, a comment on `comment`. The other
    # is null, and `contains(null, ...)` is false, so this covers both.
    # The second clause is the loop guard. With AGENT_GITHUB_TOKEN the agent
    # comments as a person, so the action's own bot-actor protection does not
    # apply — and a reply of its own that quoted `@claude` would trigger
    # another reply. Its reports all carry this marker.
    if: |
      (contains(github.event.comment.body, '@claude') ||
       contains(github.event.review.body, '@claude')) &&
      !contains(github.event.comment.body, 'Claude finished')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A review comment usually asks for a behaviour change, so the agent needs
      # to be able to re-run the gate before it replies.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without a token here the action authenticates as the Claude GitHub
          # App, which has to be installed on the repository. Supplying one
          # skips that entirely. AGENT_GITHUB_TOKEN should be a PAT: GitHub
          # does not trigger workflows on commits pushed with GITHUB_TOKEN, so
          # on the fallback the agent's pull request shows no verify run of its
          # own until someone pushes to it.
          # GITHUB_TOKEN deliberately, not AGENT_GITHUB_TOKEN. This pass only
          # comments; it never opens a pull request or pushes, so it gains
          # nothing from a personal token — and with one its comments are
          # attributed to the person whose token it is, which on their own
          # pull request reads as them reviewing their own work.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Interactive mode never invokes the build skill, so it never picks
          # up that skill's `allowed-tools` grant — without this the agent can
          # read and edit files but cannot run a test, boot the app or touch
          # the GitHub API. It answers review comments it has no way to verify.
          claude_args: >-
            --model claude-opus-5 --max-turns 60
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
